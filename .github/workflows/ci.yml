name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test_backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and test backend
        run: mvn -B -f backend-module clean verify
      - name: Check code coverage (95% minimum)
        run: mvn -B -f backend-module jacoco:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend-module/target/site/jacoco/

  build_backend_image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: test_backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-module
          file: ./backend-module/Dockerfile
          push: false
          tags: bipapp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
