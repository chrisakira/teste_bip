name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test_backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and test backend
        run: mvn -B -f backend-module clean verify
      - name: Check code coverage (95% minimum)
        run: mvn -B -f backend-module jacoco:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: jacoco-report
          path: backend-module/target/site/jacoco/
