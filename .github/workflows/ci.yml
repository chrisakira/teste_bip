name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test_backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and test backend
        run: mvn -B -f backend-module clean verify
      - name: Check code coverage (95% minimum)
        run: mvn -B -f backend-module jacoco:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend-module/target/site/jacoco/

  build_backend_image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: test_backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-module
          file: ./backend-module/Dockerfile
          push: false
          tags: bipapp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test_frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: test_backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-cache-${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-frontend-
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests (Karma)
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --no-watch --code-coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Check frontend coverage threshold (80%)
        working-directory: frontend
        run: node scripts/check-coverage.js 80 frontend/coverage/bip-app/lcov.info
  build_frontend_image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: test_frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: bipapp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
