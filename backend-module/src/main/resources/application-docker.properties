# Use PostgreSQL in production/development via Docker Compose
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bipapp}
spring.datasource.username=${DB_USER:bipuser}
spring.datasource.password=${DB_PASSWORD:bippass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SQL initialization - disabled for Docker/production (data persists in volume)
spring.sql.init.mode=never

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
